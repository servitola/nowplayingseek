name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: pipx install pre-commit==4.6.2
      - run: make lint

  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: make test
